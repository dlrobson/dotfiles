name: npins update

# Bumps npins/sources.json and merges the result when something moved.
# Renovate cannot do this job: its nix manager only understands flake.lock, and
# this repo pins every dependency with npins instead.
on:
  schedule:
    # Daily 04:23 UTC. Off the top of the hour on purpose: GitHub delays or
    # drops `schedule` runs when load is high, and the start of every hour is
    # its documented peak.
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: npins-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update pins
        run: nix-shell shell.nix --run update-pins
      - name: Detect pin changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- npins/sources.json; then
            echo "No pin changes, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- npins/sources.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Gate: an unbuildable bump fails here and never reaches a pull request.
      - name: Check
        if: steps.diff.outputs.changed == 'true'
        run: nix-shell shell.nix --run check
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: nix-shell shell.nix --run run-tests
      - name: Open and merge the pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          branch=npins-update
          path=npins/sources.json

          # The branch is moved to main's tip and the bumped file committed
          # through the contents API. An equivalent `git push` is refused with
          # "refusing to allow a GitHub App to create or update workflow
          # .github/workflows/npins-update.yml without workflows permission":
          # this token is a GitHub App, and `workflows` is not a permission it
          # can be granted. The API commit names one path, so no workflow file
          # is part of the change.
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if gh api "repos/$GH_REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/heads/$branch" \
              -f sha="$main_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$main_sha" >/dev/null
          fi

          gh api -X PUT "repos/$GH_REPO/contents/$path" \
            -f message="chore(deps): update pins" \
            -f content="$(base64 -w0 "$path")" \
            -f branch="$branch" \
            -f sha="$(gh api "repos/$GH_REPO/contents/$path?ref=$branch" --jq .sha)" >/dev/null

          # One branch per bump, so a run that lands while a previous pull
          # request is still open updates that pull request.
          pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            echo "Updated the existing open pull request #$pr."
          else
            pr="$(gh pr create --base main --head "$branch" \
              --title "chore(deps): update pins" \
              --body "Scheduled \`update-pins\` run (\`npins upgrade && npins update\`). \`check\` and \`run-tests\` passed in this workflow run.")"
          fi

          # Merge here rather than through auto-merge: main requires no status
          # checks, so auto-merge would merge before anything had run. The check
          # and test steps above are the gate, and the push to main runs ci.yml
          # on the merged commit.
          #
          # Mergeability is computed asynchronously after the push, so the first
          # attempt can fail on a pull request that is still being evaluated.
          for _ in $(seq 1 12); do
            if gh pr merge "$pr" --rebase --delete-branch; then
              exit 0
            fi
            sleep 10
          done
          echo "Could not merge $pr." >&2
          exit 1
