name: npins update

# Bumps npins/sources.json and opens a pull request when something moved.
# Renovate cannot do this job: its nix manager only understands flake.lock, and
# this repo pins every dependency with npins instead.
on:
  schedule:
    # Daily 04:23 UTC. Off the top of the hour on purpose: GitHub delays or
    # drops `schedule` runs when load is high, and the start of every hour is
    # its documented peak.
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: npins-update
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Dispatching ci.yml needs actions: write.
  actions: write

jobs:
  update-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Update pins
        run: nix-shell shell.nix --run update-pins
      - name: Detect pin changes
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- npins/sources.json; then
            echo "No pin changes, nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git --no-pager diff -- npins/sources.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Gate: an unbuildable bump fails here and never reaches a pull request.
      - name: Check
        if: steps.diff.outputs.changed == 'true'
        run: nix-shell shell.nix --run check
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: nix-shell shell.nix --run run-tests
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          branch=npins-update
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git checkout -B "$branch"
          git add npins/sources.json
          git commit -m "chore(deps): update pins"
          git push origin "$branch" --force

          # One branch per bump, force-pushed, so a run that lands while the
          # previous pull request is still open updates that pull request rather
          # than failing on the push.
          open_prs="$(gh pr list --head "$branch" --state open --json number --jq length)"
          if [ "$open_prs" != "0" ]; then
            echo "Updated the existing open pull request for $branch."
            exit 0
          fi

          gh pr create --base main --head "$branch" \
            --title "chore(deps): update pins" \
            --body "Scheduled \`update-pins\` run (\`npins upgrade && npins update\`). \`check\` and \`run-tests\` passed in the workflow run that opened this pull request."

      # A pull request opened with GITHUB_TOKEN raises a pull_request event that
      # GitHub holds as action_required, so the pull request's own CI would sit
      # unapproved. workflow_dispatch is the exception: GITHUB_TOKEN can trigger
      # it, and the run reports its checks on the branch's commit.
      - name: Run CI on the branch
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref npins-update
