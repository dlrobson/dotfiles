name: CI
on:
  push:
    branches: [main]
    # A pin bump names only npins/sources.json, and the npins update job runs
    # these same commands before it merges. Its own push creates no workflow run
    # (GITHUB_TOKEN), and it dispatches this workflow after merging instead.
    paths-ignore:
      - npins/sources.json
  pull_request:
    # Same file, same reason: the bump pull request is merged by the job that
    # opened it, so a run here would start against a branch that is already gone.
    paths-ignore:
      - npins/sources.json
  workflow_dispatch:

permissions:
  contents: read
  # cache-nix-action removes expired caches through the REST API.
  actions: write

# A superseded push has nothing left to prove, and these jobs hold a runner for
# twenty minutes each.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `nix_path`. `shell.nix` resolves every input through `pins.nix` and
      # the profiles are passed an explicit `-I nixpkgs=`, so nothing needs
      # `<nixpkgs>`. Leaving NIX_PATH unset makes a stray lookup fail loudly
      # instead of resolving to whatever channel the action installed.
      - uses: cachix/install-nix-action@v27
      # cache.nixos.org has neither the unfree packages (vscode, claude-code)
      # nor the npm tarballs paseo pulls in, so every run without this built
      # 1726 derivations: a measured 17m37s for the Test step, against 50s when
      # those paths come from a cache. Keyed on the pins, because they are what
      # moves those derivations; a code-only commit restores the same snapshot,
      # and a pin bump restores the previous one by prefix and builds the churn.
      # A snapshot is 5.5GB of the 10GB GitHub allows per repo, so main saves.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-store-v1-${{ runner.os }}-${{ hashFiles('npins/sources.json') }}
          restore-prefixes-first-match: nix-store-v1-${{ runner.os }}-
          save: ${{ github.ref == 'refs/heads/main' }}
          purge: true
          purge-prefixes: nix-store-v1-${{ runner.os }}-
          purge-last-accessed: P14D
          purge-primary-key: never
      - name: Check
        run: nix-shell shell.nix --run "check"
      - name: Test
        run: nix-shell shell.nix --run "run-tests"

  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      # Restore only: this job builds one profile, and saving here would race the
      # ci job's save and win with a store that lacks the other two profiles.
      - name: Restore the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-store-v1-${{ runner.os }}-${{ hashFiles('npins/sources.json') }}
          restore-prefixes-first-match: nix-store-v1-${{ runner.os }}-
          save: false
      - name: Run setup.sh (minimal profile)
        run: ./setup.sh minimal
